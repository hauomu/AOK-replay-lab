name: stage2-baseline

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "stage2/**"

jobs:
  requirements:
    name: requirements (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: discord_bot
            file: discord_bot/requirements.txt
          - name: strategy_mining
            file: strategy_mining/requirements.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install declared requirements
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r "${{ matrix.file }}"
      - name: Verify installed dependencies
        run: python -m pip check
